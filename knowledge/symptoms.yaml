# MediGuide AI - multilingual symptom vocabulary
# ------------------------------------------------------------------------------------
# Each CONCEPT is one thing the NLP layer can recognise. Its `id` is the language-neutral
# internal representation: Telugu, Hindi and English phrases all map to the same id.
#
#   kind      symptom  -> a model feature (linked to NHAMCS reason-for-visit codes)
#             sign     -> a warning feature used ONLY by the safety rules (no model input)
#             context  -> patient context (e.g. pregnancy) used by rules
#   rfv       NHAMCS reason-for-visit codes (verified against data/processed/rfv_codes.csv)
#   label     display name per language (shown back to the user for confirmation)
#   terms     surface phrases per language, matched case-insensitively on tokens
#
# REVIEW STATUS: English terms - project draft.
#                Telugu (te) and Hindi (hi) terms - DRAFT, PENDING NATIVE-SPEAKER AND
#                CLINICIAN REVIEW (see docs/clinical_review_log.md).
#
# NOTE for the negation detector (Phase 3): some sign phrases CONTAIN a negation word
# ("can't breathe", "won't stop bleeding", "రక్తం ఆగడం లేదు"). A negation cue that lies
# INSIDE a matched phrase is part of the phrase and must not negate it.
# ------------------------------------------------------------------------------------
