# MediGuide AI - red-flag safety rules
# ------------------------------------------------------------------------------------
# These rules are evaluated BEFORE and INDEPENDENTLY of the machine-learning model.
#   level EMERGENCY -> show emergency guidance immediately, skip follow-up questions
#   level URGENT    -> the final recommendation can never be lower than URGENT
# The ML model may RAISE a rule level, never LOWER it.
#
# A rule fires if ANY of its clauses matches. A clause matches if ALL of its conditions hold:
#   all:   [concept ids]   every listed concept is present and NOT negated
#   any:   [concept ids]   at least one listed concept is present and NOT negated
#   severity: severe       a concept in `all` (or `any`, if no `all`) is reported as severe
#   onset: sudden          a concept in `all` (or `any`) started suddenly
#   onset_not: gradual     onset is anything except an explicit "gradual" (unknown counts)
#   min_duration_days: N   a concept in `all` (or `any`) has lasted >= N days
#   context: [ids]         every listed context concept is present (e.g. pregnant)
#   max_age_months: N      patient age (from profile or text) is <= N months
#   (a clause with no all/any applies severity/onset/duration to ANY reported concept)
#
# Every rule lists `sources` (keys into the `sources` table below) and quotes the guideline
# text it encodes. Where we are MORE conservative than the source, `note` says so.
# Rules marked source `project_policy` are design choices without an external source.
#
# REVIEW STATUS: DRAFT, PENDING CLINICIAN REVIEW (see docs/clinical_review_log.md).
# ------------------------------------------------------------------------------------
version: 1
status: draft-unreviewed

sources:
  nhs_chest_pain:     {title: "Chest pain", publisher: NHS, url: "https://www.nhs.uk/symptoms/chest-pain/", accessed: 2026-11-10}
  nhs_sob:            {title: "Shortness of breath", publisher: NHS, url: "https://www.nhs.uk/symptoms/shortness-of-breath/", accessed: 2026-11-10}
  nhs_stroke:         {title: "Stroke - symptoms", publisher: NHS, url: "https://www.nhs.uk/conditions/stroke/symptoms/", accessed: 2026-11-10}
  nhs_sah:            {title: "Subarachnoid haemorrhage", publisher: NHS, url: "https://www.nhs.uk/conditions/subarachnoid-haemorrhage/", accessed: 2026-11-10}
  nhs_headaches:      {title: "Headaches", publisher: NHS, url: "https://www.nhs.uk/symptoms/headaches/", accessed: 2026-11-10}
  nhs_epilepsy:       {title: "Epilepsy", publisher: NHS, url: "https://www.nhs.uk/conditions/epilepsy/", accessed: 2026-11-10}
  nhs_anaphylaxis:    {title: "Anaphylaxis", publisher: NHS, url: "https://www.nhs.uk/conditions/anaphylaxis/", accessed: 2026-11-10}
  nhs_meningitis:     {title: "Meningitis", publisher: NHS, url: "https://www.nhs.uk/conditions/meningitis/", accessed: 2026-11-10}
  nhs_sepsis:         {title: "Sepsis", publisher: NHS, url: "https://www.nhs.uk/conditions/sepsis/", accessed: 2026-11-10}
  nhs_confusion:      {title: "Confusion", publisher: NHS, url: "https://www.nhs.uk/symptoms/confusion/", accessed: 2026-11-10}
  nhs_head_injury:    {title: "Head injury and concussion", publisher: NHS, url: "https://www.nhs.uk/conditions/head-injury-and-concussion/", accessed: 2026-11-10}
  nhs_fainting:       {title: "Fainting", publisher: NHS, url: "https://www.nhs.uk/conditions/fainting/", accessed: 2026-11-10}
  nhs_stomach_ache:   {title: "Stomach ache", publisher: NHS, url: "https://www.nhs.uk/symptoms/stomach-ache/", accessed: 2026-11-10}
  nhs_vomiting_blood: {title: "Vomiting blood", publisher: NHS, url: "https://www.nhs.uk/conditions/vomiting-blood/", accessed: 2026-11-10}
  nhs_coughing_blood: {title: "Coughing up blood", publisher: NHS, url: "https://www.nhs.uk/conditions/coughing-up-blood/", accessed: 2026-11-10}
  nhs_blood_in_urine: {title: "Blood in urine", publisher: NHS, url: "https://www.nhs.uk/conditions/blood-in-urine/", accessed: 2026-11-10}
  nhs_preg_bleeding:  {title: "Vaginal bleeding in pregnancy", publisher: NHS, url: "https://www.nhs.uk/pregnancy/related-conditions/common-symptoms/vaginal-bleeding/", accessed: 2026-11-10}
  nhs_suicidal:       {title: "Help for suicidal thoughts", publisher: NHS, url: "https://www.nhs.uk/mental-health/feelings-symptoms-behaviours/behaviours/help-for-suicidal-thoughts/", accessed: 2026-11-10}
